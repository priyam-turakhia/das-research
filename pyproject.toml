[project]
name = "das-research"
version = "0.1.0"
description = "Modular tokenization pipeline for Upper and Lower Sorbian"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sentencepiece>=0.1.99",
    "morfessor>=2.0.6",
    "tokenizers>=0.15.0",
    "transformers>=4.36.0",
    "requests>=2.31.0",
    "sacremoses>=0.1.1",
    "huggingface-hub>=0.20",
    "fasttext>=0.9.2",
    "numpy<2",
    "torch>=2.2.0",
    "datasets>=2.16.0",
    "accelerate>=1.13.0",
    "sentence-transformers>=5.6.0",
]
